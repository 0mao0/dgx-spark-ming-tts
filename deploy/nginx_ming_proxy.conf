# Streaming proxy: :8101 -> 127.0.0.1:8094 (vLLM-Omni)
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx_ming.pid;
events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log off;
    sendfile      on;
    keepalive_timeout 300;

    server {
        listen 8101;
        server_name _;

        # API only; hide the engine's debug pages.
        location = /docs  { return 404; }
        location = /redoc { return 404; }
        location = /openapi.json { return 404; }

        location / {
            proxy_pass http://127.0.0.1:8094;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;          # streaming: pass the first byte immediately
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 120s;
            client_max_body_size 64m;
        }
    }
}
