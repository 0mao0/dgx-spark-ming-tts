    # ---- Ming-3.0-TTS public API ----
    # Canonical shape: https://<your-domain>/api/ming/v1/audio/speech
    # Authentication lives in conf.d/ming-token.conf (separate from other routes).
    location = /api/ming { return 308 /api/ming/v1/; }
    location = /api/ming/v1 { return 308 /api/ming/v1/; }
    location /api/ming/v1/ {
        if ($ming_ok = 0) { return 401; }
        proxy_pass http://ming_backend/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 4s;
        proxy_next_upstream error http_502 http_504 non_idempotent;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 64m;
    }
