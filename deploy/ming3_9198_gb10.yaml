pipeline: ming3_tts
async_chunk: true
trust_remote_code: false
dtype: bfloat16
enable_prefix_caching: false
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      latent_chunk_size: 25
      initial_latent_chunk_size: 4
      latent_chunk_ramp: true
      latent_left_context: 0
      ar_prefill_admission_min_batch: 4
      ar_prefill_admission_max_wait_ms: 300
      ar_prefill_admission_min_running: 6
stages:
- stage_id: 0
  max_num_seqs: 10
  gpu_memory_utilization: 0.22
  enforce_eager: false
  enable_prefix_caching: false
  async_scheduling: false
  compilation_config:
    cudagraph_mode: FULL_AND_PIECEWISE
    cudagraph_capture_sizes:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 24
    - 32
    - 48
    - 64
    - 96
    - 128
    - 192
    - 256
    - 384
    - 512
    - 768
    - 1024
    - 1536
    - 2048
    - 3072
    - 4096
    cudagraph_num_of_warmups: 1
  max_num_batched_tokens: 4096
  max_model_len: 4096
  devices: '0'
  output_connectors:
    to_stage_1: connector_of_shared_memory
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 801
    detokenize: true
- stage_id: 1
  max_num_seqs: 10
  gpu_memory_utilization: 0.05
  enforce_eager: true
  enable_prefix_caching: false
  async_scheduling: false
  max_num_batched_tokens: 8192
  max_model_len: 4096
  devices: '0'
  input_connectors:
    from_stage_0: connector_of_shared_memory
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 1
    detokenize: false
