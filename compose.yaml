services:
  ming-tts:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:13.0.3-devel-ubuntu24.04}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        GH_PROXY: ${GH_PROXY:-}
    image: dgx-spark-ming-tts:0.2
    container_name: ming-tts
    network_mode: host
    ipc: host
    privileged: true
    shm_size: 16gb
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
    environment:
      MODEL_DIR: /models/Ming-3.0-tts-tiny
      SERVED_NAME: ming3
      PORT: ${PORT:-8094}
      DISABLE_DOCS: ${DISABLE_DOCS:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/v1/models' % os.environ.get('PORT','8094'), timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 300s
